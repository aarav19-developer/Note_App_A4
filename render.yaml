services:
  # ── Backend API ────────────────────────────────────────────────
  - type: web
    name: shouthub-backend
    runtime: node
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: mongourl
        sync: false          # Set this in Render dashboard — your MongoDB Atlas URL
      - key: JWT_SECRET
        sync: false          # Set this in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your frontend Render URL, e.g. https://shouthub.onrender.com

  # ── Frontend (Static Site) ────────────────────────────────────
  - type: static
    name: shouthub-frontend
    rootDir: frontend/Shout
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # Set to your backend Render URL, e.g. https://shouthub-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
